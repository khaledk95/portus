name: CI

# The release workflow only runs on a v* tag, which is too late to learn that
# something is broken. This runs the same tests on every push and pull request.
on:
  push:
    branches:
      - main
  pull_request:
  # Runnable by hand. Without this there is no way to get an answer for a commit
  # whose automatic run never happened — GitHub failed to allocate a runner for
  # one push, reported "the job was not acquired by Runner of type hosted", and
  # the commit after it got no run at all.
  workflow_dispatch:

# A newer push to the same branch makes the previous run's answer irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suite stubs the platform in places, but several paths are genuinely
    # platform-specific — the terminal launcher, the macOS credential script, the
    # Windows shell probe. An ubuntu-only run cannot see a regression in the two it
    # is not on, which is exactly how the azure-chain SSM-shell section came to
    # assert Linux behaviour and still pass CI while failing on macOS and Windows.
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red platform should still report the others rather than cancel them
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
