name: CI

# The release workflow only runs on a v* tag, which is too late to learn that
# something is broken. This runs the same tests on every push and pull request.
on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch makes the previous run's answer irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
