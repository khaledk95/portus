name: Build macOS App

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install setuptools wheel

    - name: Install dependencies
      run: npm install

    - name: Build for macOS (unsigned)
      run: npm run dist:mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
        CSC_LINK: ""
        CSC_KEY_PASSWORD: ""
        ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
        ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

    - name: Upload macOS x64 build
      uses: actions/upload-artifact@v4
      with:
        name: portus-macos-x64
        path: |
          dist/*x64*.dmg
          dist/*x64*.blockmap
        retention-days: 30

    - name: Upload macOS arm64 build
      uses: actions/upload-artifact@v4
      with:
        name: portus-macos-arm64
        path: |
          dist/*arm64*.dmg
          dist/*arm64*.blockmap
        retention-days: 30

    - name: Upload to Release x64 (if tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*x64*.dmg
        name: "Portus macOS x64"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Release arm64 (if tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*arm64*.dmg
        name: "Portus macOS arm64"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
