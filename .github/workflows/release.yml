name: Release

# macOS artifacts can only be produced on macOS, so building all three
# platforms means one runner each. Pushing a v* tag builds everything and
# publishes the release automatically; workflow_dispatch allows a manual run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs first and gates everything: a tag that fails its own tests should not
  # produce installers, let alone a release.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    strategy:
      # One platform failing should not discard the artifacts from the others
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            build: npm run build:win64
          - os: macos-latest
            name: macOS
            build: npm run build:mac
          - os: ubuntu-latest
            name: Linux
            build: npm run build:linux

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # dmg-license builds through node-gyp, which needs Python
      - name: Setup Python (macOS only)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The rpm target shells out to rpmbuild, which the runner image lacks
      - name: Install rpm tooling (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      # The `--` matters: without it npm consumes --publish itself and passes a
      # bare "always" through, which electron-builder rejects as an unknown
      # argument before any build starts.
      #
      # --publish never, deliberately. electron-builder's GitHub publisher looks
      # for a draft release for the tag and creates one if it finds none. All
      # three runners start together, all three look before any has created, and
      # all three create — GitHub allows it because a draft does not bind the
      # tag. That produced three releases for v2.2.0, one per platform. The files
      # are handed to the publish job instead, which creates exactly one release.
      - name: Build
        run: ${{ matrix.build }} -- --publish never
        env:
          # No Apple Developer certificate is configured, so builds stay unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1
          # Named extensions rather than dist/*: the unpacked application
          # directories also live there and must not reach the release.
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest*.yml

  # One job, one release. Runs only once every platform has built, so nobody can
  # download a release that is missing an OS.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Artifacts arrive in a directory per matrix job; the release wants them flat
      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv -t dist/ {} +
          ls -lh dist

      - name: Resolve tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A release missing a platform is worse than a failed workflow, so the
      # absence of any one of them stops the publish rather than shipping a gap.
      - name: Check every platform is present
        run: |
          for pattern in '*.exe' '*.dmg' '*.AppImage' '*.deb' '*.rpm'; do
            if ! compgen -G "dist/$pattern" > /dev/null; then
              echo "::error::No $pattern in the collected artifacts — refusing to publish an incomplete release"
              exit 1
            fi
          done
        shell: bash

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            # a re-run: replace the assets on the release that already exists
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --draft=false --latest
          else
            # Titled with the tag itself: the repository name already heads the
            # releases page, and a title that differs from the tag people search
            # for is a papercut with nothing to gain.
            gh release create "$tag" dist/* \
              --title "$tag" \
              --notes-from-tag \
              --latest
          fi
