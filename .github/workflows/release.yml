name: Release

# macOS artifacts can only be produced on macOS, so building all three
# platforms means one runner each. Pushing a v* tag builds everything and
# publishes the release automatically; workflow_dispatch allows a manual run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not discard the artifacts from the others
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            build: npm run build:win64
          - os: macos-latest
            name: macOS
            build: npm run build:mac
          - os: ubuntu-latest
            name: Linux
            build: npm run build:linux

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # dmg-license builds through node-gyp, which needs Python
      - name: Setup Python (macOS only)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The rpm target shells out to rpmbuild, which the runner image lacks
      - name: Install rpm tooling (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      # The `--` matters: without it npm consumes --publish itself and passes a
      # bare "always" through, which electron-builder rejects as an unknown
      # argument before any build starts.
      - name: Build and upload
        run: ${{ matrix.build }} -- --publish always
        env:
          # electron-builder reads GH_TOKEN; the token Actions injects is enough
          # to create and upload to a release in this repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer certificate is configured, so builds stay unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Each build uploads into the same draft. Publishing only once they have all
  # finished stops anyone downloading a release that is missing a platform.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag from package version
        id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Mark the draft as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.tag.outputs.tag }}" --draft=false --latest
